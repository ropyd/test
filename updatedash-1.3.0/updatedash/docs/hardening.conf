# Optional stricter systemd sandbox for the dashboard. NOT enabled by default and not verified on every
# LXC/kernel combination: some options need user namespaces or seccomp that unprivileged containers may restrict.
#
#   sudo mkdir -p /etc/systemd/system/updatedash.service.d
#   sudo cp hardening.conf /etc/systemd/system/updatedash.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart updatedash
#   systemctl status updatedash          # if it fails to start, delete the drop-in and restart
#   systemd-analyze security updatedash  # shows the exposure score before/after
[Service]
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
