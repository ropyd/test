# updatedash configuration  (installed to /etc/updatedash/config.yaml)

listen: "0.0.0.0:8099"
username: admin
password: "CHANGE-ME"          # install.sh generates a random one on first install

transport: pve                 # pve = SSH to the Proxmox host, then `pct exec`
                               # local = run commands on this machine (testing only)
pve:
  host: 10.10.56.5             # your Proxmox host IP
  user: root
  key: /etc/updatedash/id_ed25519

snapshot_before_update: true   # take a `pre-update-*` snapshot of the CT first; abort if it fails
keep_snapshots: 2              # keep the newest N pre-update snapshots per CT
check_interval_minutes: 360
github_token: ""               # optional; avoids GitHub's anonymous rate limit

# How each service is checked
#   latest.type: apt      -> compares installed vs candidate version of one apt package
#   latest.type: github   -> `current` (a command run inside the CT) vs the latest GitHub release
#   latest.type: command  -> `current` vs the output of latest.cmd (run inside the CT)
# How it is updated
#   apt services:   apt-get install --only-upgrade <package>   (non-interactive, reliable)
#   others:         the community-scripts `update` command, with Enter pressed on the default menu item
#   `update:`       override with any command you like
# `os_updates: false` hides the OS package count for a service.
services:
  - name: Jellyfin
    ctid: 110
    latest: {type: apt, package: jellyfin}
    # update: "export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y --only-upgrade jellyfin jellyfin-ffmpeg7"

  - name: Plex
    ctid: 111
    latest: {type: apt, package: plexmediaserver}

  # VERIFY the `current:` file for these two (see README, "Find the version file").
  - name: Sonarr
    ctid: 112
    current: "cat /opt/Sonarr_version.txt"
    latest: {type: github, repo: Sonarr/Sonarr}

  - name: Vaultwarden
    ctid: 113
    current: "cat /opt/vaultwarden_version.txt"
    latest: {type: github, repo: dani-garcia/vaultwarden}
