<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · Update Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="loginpage">
<main class="logincard">
  <h1>Update Dashboard</h1>
  <p class="muted">Sign in to continue.</p>
  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="loginError" class="err" role="alert" aria-live="assertive"></p>
    <button id="loginBtn" class="btn primary wide" type="submit">Sign in</button>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
